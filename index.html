        :root {
            --primary-color: #00ff41;
            --primary-rgb: 0, 255, 65;
            --text-highlight: #ffffff;
        }

        body.blue-theme {
            --primary-color: #00d4ff;
            --primary-rgb: 0, 212, 255;
            --text-highlight: #e0f7ff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212;
            background-image: 
                linear-gradient(rgba(var(--primary-rgb), 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--primary-rgb), 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Share Tech Mono', monospace;
            color: var(--primary-color);
            user-select: none;
            transition: background-image 0.3s ease, color 0.3s ease;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(18, 18, 18, 0.85);
            border: 2px solid var(--primary-color);
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.2);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .ui-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .ui-row:last-child {
            margin-bottom: 0;
        }

        .bracket {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--primary-color);
            margin-right: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .label {
            width: 120px;
            flex-shrink: 0;
        }

        #selected-city, #time-display {
            color: var(--text-highlight);
            text-shadow: 0 0 5px rgba(var(--primary-rgb), 0.8);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        #time-display {
            font-size: 1.5rem;
        }

        /* Search Input Styling */
        #search-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--primary-color);
            color: var(--text-highlight);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
            width: 100%;
            outline: none;
            padding: 5px 0;
            transition: border-color 0.3s ease, color 0.3s ease;
        }

        #search-input::placeholder {
            color: var(--primary-color);
            opacity: 0.4;
            letter-spacing: 2px;
        }

        #search-input:focus {
            border-bottom: 2px solid var(--text-highlight);
        }

        /* UI Elements */
        #site-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(var(--primary-rgb), 0.5);
            z-index: 10;
            pointer-events: none;
        }

        #copyright {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
            z-index: 10;
            letter-spacing: 1px;
            pointer-events: none;
        }

        #theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(18, 18, 18, 0.8);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-family: 'Share Tech Mono', monospace;
            padding: 8px 15px;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 10;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        #theme-toggle:hover {
            background: var(--primary-color);
            color: #121212;
            box-shadow: 0 0 15px rgba(var(--primary-rgb), 0.5);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            z-index: 20;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #instructions {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        const scene = new THREE.Scene();

        camera.position.z = 280;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        // Colors
        let neonGreen = 0x00ff41;

        // 1. The Wireframe Globe
        const globeRadius = 100;
        const sphereGeo = new THREE.SphereGeometry(globeRadius, 36, 36);
        const sphereMat = new THREE.MeshBasicMaterial({ 
            color: neonGreen, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.15 
        });
        const globeMesh = new THREE.Mesh(sphereGeo, sphereMat);
        globeGroup.add(globeMesh);

        // Outer bounding grid box
        const boxSize = 240;
        const boxGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const boxEdges = new THREE.EdgesGeometry(boxGeo);
        const boxLines = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({ color: neonGreen, opacity: 0.3, transparent: true }));
        globeGroup.add(boxLines);

        // 2. Add Capitals
        const cityPoints = [];
        const pointGeo = new THREE.SphereGeometry(1.5, 8, 8);
        const pointMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const hitAreaGeo = new THREE.SphereGeometry(4, 8, 8);
        const hitAreaMat = new THREE.MeshBasicMaterial({ visible: false });

        capitalsData.forEach((data) => {
            const [name, lat, lon, tz] = data;
            
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(globeRadius * Math.sin(phi) * Math.cos(theta));
            const y = (globeRadius * Math.cos(phi));
            const z = (globeRadius * Math.sin(phi) * Math.sin(theta));

            const point = new THREE.Mesh(pointGeo, pointMat);
            point.position.set(x, y, z);
            globeGroup.add(point);

            const hitArea = new THREE.Mesh(hitAreaGeo, hitAreaMat);
            hitArea.position.set(x, y, z);
            hitArea.userData = { name, tz };
            globeGroup.add(hitArea);
            cityPoints.push(hitArea);
        });

        document.getElementById('loading').style.display = 'none';

        // --- INTERACTION ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let clickStartPos = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };

        targetRotation.y = -0.5;
        targetRotation.x = 0.2;
        currentRotation.y = -0.5;
        currentRotation.x = 0.2;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            clickStartPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };
                targetRotation.y += deltaMove.x * 0.005;
                targetRotation.x += deltaMove.y * 0.005;
                targetRotation.x = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, targetRotation.x));
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                const moveDistance = Math.sqrt(
                    Math.pow(e.clientX - clickStartPos.x, 2) + 
                    Math.pow(e.clientY - clickStartPos.y, 2)
                );
                if (moveDistance < 5) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(cityPoints);
                    if (intersects.length > 0) {
                        const selectedData = intersects[0].object.userData;
                        selectCity(selectedData.name, selectedData.tz);
                    }
                }
            }
        });

        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                clickStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const deltaMove = {
                    x: e.touches[0].clientX - previousMousePosition.x,
                    y: e.touches[0].clientY - previousMousePosition.y
                };
                targetRotation.y += deltaMove.x * 0.005;
                targetRotation.x += deltaMove.y * 0.005;
                targetRotation.x = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, targetRotation.x));
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        window.addEventListener('touchend', (e) => {
            if (isDragging) {
                isDragging = false;
                const moveDistance = Math.sqrt(
                    Math.pow(e.changedTouches[0].clientX - clickStartPos.x, 2) + 
                    Math.pow(e.changedTouches[0].clientY - clickStartPos.y, 2)
                );
                if (moveDistance < 5) {
                    mouse.x = (e.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(cityPoints);
                    if (intersects.length > 0) {
                        const selectedData = intersects[0].object.userData;
                        selectCity(selectedData.name, selectedData.tz);
                    }
                }
            }
        });

        // --- TIME LOGIC ---
        let activeTimezone = null;
        const cityDisplay = document.getElementById('selected-city');
        const timeDisplay = document.getElementById('time-display');
        const searchInput = document.getElementById('search-input');

        function selectCity(name, tz) {
            activeTimezone = tz;
            cityDisplay.textContent = name.toUpperCase();
            updateTime();
            // Update search input without triggering focus loss
            if (document.activeElement !== searchInput) {
                searchInput.value = name;
            }
        }

        function updateTime() {
            if (!activeTimezone) return;
            const now = new Date();
            const options = {
                timeZone: activeTimezone,
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            };
            try {
                const formatter = new Intl.DateTimeFormat('en-US', options);
                timeDisplay.textContent = formatter.format(now);
            } catch (e) {
                timeDisplay.textContent = "ERR";
            }
        }

        setInterval(updateTime, 1000);

        // --- SEARCH LOGIC ---
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim().toLowerCase();
                if (!query) return;
                
                // Find exact match first, then partial match
                let match = capitalsData.find(cap => cap[0].toLowerCase() === query);
                if (!match) {
                    match = capitalsData.find(cap => cap[0].toLowerCase().includes(query));
                }
                
                if (match) {
                    selectCity(match[0], match[3]);
                    searchInput.blur(); // Remove focus to show full UI
                } else {
                    cityDisplay.textContent = "NOT FOUND";
                    timeDisplay.textContent = "--:--:--";
                    activeTimezone = null;
                }
            }
        });

        // Clear on focus to allow new search
        searchInput.addEventListener('focus', () => {
            searchInput.value = '';
            cityDisplay.textContent = "SELECT A CAPITAL";
            timeDisplay.textContent = "--:--:--";
            activeTimezone = null;
        });

        // --- THEME LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('blue-theme');
            const isBlue = document.body.classList.contains('blue-theme');
            themeToggle.textContent = isBlue ? 'GREEN THEME' : 'BLUE THEME';
            
            // Update Three.js scene colors
            const newColor = isBlue ? 0x00d4ff : 0x00ff41;
            sphereMat.color.setHex(newColor);
            boxLines.material.color.setHex(newColor);
        });

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;
            globeGroup.rotation.x = currentRotation.x;
            globeGroup.rotation.y = currentRotation.y;

            if (!isDragging) {
                targetRotation.y += 0.0005;
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
